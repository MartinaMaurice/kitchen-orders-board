<div class="filters">
  <div class="filters__search">
    <label class="visually-hidden" for="board-search">{{ i18n.t('board.search.label') }}</label>
    <svg class="filters__search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6" />
      <path d="M17 17L13.5 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
    <input
      id="board-search"
      type="search"
      class="filters__search-input"
      [formControl]="searchControl"
      [placeholder]="i18n.t('board.search.placeholder')"
      autocomplete="off"
    />
  </div>

  <div class="filters__types" role="group" [attr.aria-label]="i18n.t('board.filter.label')">
    <button
      type="button"
      class="filters__chip"
      [class.filters__chip--active]="type() === 'all'"
      (click)="onTypeChange('all')"
    >
      {{ i18n.t('type.all') }}
    </button>
    @for (t of types; track t) {
      <button
        type="button"
        class="filters__chip"
        [class.filters__chip--active]="type() === t"
        (click)="onTypeChange(t)"
      >
        {{ i18n.t('type.' + t) }}
      </button>
    }
  </div>
</div>
